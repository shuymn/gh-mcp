name: Publish release

on:
  workflow_call:
    inputs:
      target_sha:
        description: Commit that passed the caller's CI jobs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: >-
      github.repository == 'shuymn/gh-mcp' &&
      github.ref == 'refs/heads/main' &&
      inputs.target_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Skips releases that are already published. A release whose CI finished
      # after a newer one is still published, without taking "latest".
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: go run ./tools/release plan -target-sha "$TARGET_SHA"

      - name: Create release tag
        if: steps.plan.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"
          -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${TARGET_SHA}" >/dev/null

      - name: Restore upstream archives cache
        if: steps.plan.outputs.publish == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/upstream
          key: upstream-${{ hashFiles('server.lock.json') }}

      # A rerun uploads into the existing draft, so a failed job can be retried.
      - name: Build draft release
        if: steps.plan.outputs.publish == 'true'
        uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          build_script_override: scripts/build-dist.sh
          draft_release: true
          generate_attestations: true
          go_version_file: go.mod
          release_tag: ${{ steps.plan.outputs.tag }}

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          LATEST: ${{ steps.plan.outputs.latest }}
        run: gh release edit "${RELEASE_TAG:?}" --draft=false --latest="${LATEST:?}"
