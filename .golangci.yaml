version: "2"
linters:
  default: all
  disable:
    - depguard
    - cyclop
    - exhaustruct
    - forbidigo
    - funlen
    - godot
    - ireturn
    - lll
    - nlreturn
    - paralleltest
    - varnamelen
    - wsl
    - gocognit
    - contextcheck
    - wsl_v5
    - noinlineerr
    - gochecknoglobals
    - goconst
  settings:
    mnd:
      ignored-numbers:
        - "0o644"
        - "0o700"
        - "0o755"
    tagliatelle:
      case:
        rules:
          json: snake
    wrapcheck:
      ignore-package-globs:
        - github.com/shuymn/gh-mcp/*
  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - linters:
          - err113
          - noctx
        path: _test\.go
      # Release tooling reads and writes maintainer-chosen repository paths.
      - linters:
          - gosec
        path: ^tools/
        text: "G(204|304|306|702|703)"
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    warn-unused: true
